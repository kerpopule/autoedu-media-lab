name: AutoEDU.ai Media Lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/design-kit.test.cjs
      - run: python tools/identity_guard.py
      - run: python -m pytest -q -rs -m "not spark" --junitxml=cpu-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-results
          path: cpu-results.xml
